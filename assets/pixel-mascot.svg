<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgMascot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .glow-text {
        font-family: 'Fira Code', monospace;
        font-weight: bold;
        font-size: 20px;
        fill: #00E5FF;
      }
      .pixel-cat {
        animation: floatCat 3s infinite ease-in-out;
      }
      @keyframes floatCat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </defs>
  <rect width="800" height="220" rx="16" fill="url(#bgMascot)" stroke="#FF007F" stroke-width="2"/>

  <!-- Pixel Cat Mascot SVG Group -->
  <g class="pixel-cat" transform="translate(100, 30)">
    <!-- Cat Ears -->
    <rect x="20" y="20" width="20" height="20" fill="#FF007F"/>
    <rect x="80" y="20" width="20" height="20" fill="#FF007F"/>
    <!-- Head -->
    <rect x="20" y="40" width="80" height="60" fill="#1E293B" stroke="#00E5FF" stroke-width="2"/>
    <!-- Eyes -->
    <rect x="35" y="55" width="15" height="15" fill="#76FF03"/>
    <rect x="70" y="55" width="15" height="15" fill="#76FF03"/>
    <!-- Mouth -->
    <rect x="52" y="80" width="16" height="6" fill="#FF007F"/>
    <!-- Body -->
    <rect x="30" y="100" width="60" height="40" fill="#0F172A" stroke="#FF007F" stroke-width="2"/>
  </g>

  <!-- Text Speech Bubble -->
  <rect x="240" y="50" width="480" height="110" rx="12" fill="#1E293B" stroke="#00E5FF" stroke-width="2"/>
  <text x="270" y="95" class="glow-text">🐱 "Meow! Welcome to the Pixel Zone!"</text>
  <text x="270" y="130" font-family="'Fira Code', monospace" font-size="15" fill="#94A3B8">Enjoy the interactive animations, starry lights, and Easter Eggs!</text>
</svg>
