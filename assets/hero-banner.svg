<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <style>
      .title {
        font-family: 'Fira Code', 'Segoe UI', monospace;
        font-weight: 800;
        font-size: 48px;
        fill: url(#glow);
      }
      .subtitle {
        font-family: 'Fira Code', 'Segoe UI', monospace;
        font-weight: 500;
        font-size: 18px;
        fill: #94A3B8;
      }
      .star {
        fill: #38BDF8;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <circle cx="100" cy="40" r="2" class="star" style="animation-delay: 0s;"/>
  <circle cx="250" cy="150" r="3" class="star" style="animation-delay: 0.5s;"/>
  <circle cx="700" cy="50" r="2" class="star" style="animation-delay: 1s;"/>
  <circle cx="650" cy="160" r="3" class="star" style="animation-delay: 1.5s;"/>
  <circle cx="400" cy="30" r="2" class="star" style="animation-delay: 0.8s;"/>
  <text x="400" y="95" text-anchor="middle" class="title">@chimpk</text>
  <text x="400" y="135" text-anchor="middle" class="subtitle">Digital Playground • Pixel Explorer &amp; Cosmic Traveler</text>
</svg>
